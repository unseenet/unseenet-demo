[[post]]
key = "discuss-start"
by = "ole"
group = "discuss"
subject = "How do you all read this - which client?"
body = """I use the terminal client on an old laptop, from a USB stick. It feels a \
bit like reading news in 1993, in the best way. What do you use?"""

[[post]]
key = "discuss-start-r1"
by = "mira"
group = "discuss"
reply_to = "discuss-start"
body = """The graphical one, in a browser window. I like that the pictures just \
show up - and that their metadata is gone before they leave my machine."""

[[post]]
key = "discuss-start-r2"
by = "ines"
group = "discuss"
reply_to = "discuss-start-r1"
body = """Same, on my phone, through the web entrance. And the terminal one when I \
am somewhere without a decent connection."""

[[post]]
key = "discuss-names"
by = "tomas"
group = "discuss"
subject = "What is the long thing after the @ in group names?"
body = """Every group here is called something@abcd... - is that a server, like in \
email?"""

[[post]]
key = "discuss-names-r1"
by = "nadia"
group = "discuss"
reply_to = "discuss-names"
body = """It is the owner's fingerprint, not a server. Anybody can make a group \
called "bread", but only one person owns bread@<their key>. So you always know whose \
group you are in, and nobody can take it over."""

