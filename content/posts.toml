# Posts, comments and replies, in the order they are posted. `key` names a post so
# others can reply to it (`reply_to`) and demo.py remembers what it posted. `group` is a
# group from groups.toml, or "feed:<person>" for someone's personal feed. `pictures`
# are names from content/pictures/; their source is added under the text by demo.py.

# --- the shared feed and the discussion: welcome, pinned ---

[[post]]
key = "welcome-feed"
by = "demo"
group = "feed"
subject = "Welcome to the village"
pin = "Start here"
body = """This is the demo of **Unseenet**: a discussion network in the spirit of \
Usenet and the old BBSes, carried over Tor. The people here are made up; the network \
is real.

Have a look around:

- **This feed** - what the people of the demo are up to. Comment on anything.
- **Their own feeds** - follow a person, and their posts come into your timeline.
- **The chat**, **the discussion group** and **the photos** next door.
- **The site** - pages that stay, with pictures and links.

Everything is reset every Monday, so try what you like."""

[[post]]
key = "welcome-discuss"
by = "demo"
group = "discuss"
subject = "Hello, and what this group is for"
pin = "Read me first"
body = """Threads and replies, like a newsgroup. Start a thread, answer one, quote \
someone - it all stays readable as a conversation.

Some threads to begin with are below. And yes: on Monday it is all reset."""

