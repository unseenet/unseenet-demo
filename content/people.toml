# The fictional people of the demo. Each has a key derived from the demo seed and their
# name here (`key`), a profile, a picture and a personal feed. Nobody here is real.

[demo]
display = "Unseenet Demo"
about = """The demo of [Unseenet](https://unseenet.org): a few made-up people, their \
groups and feeds, so there is something to look at. Everything is reset every Monday \
- comment as you like."""
links = ["web=https://github.com/unseenet/unseenet-demo"]
picture = "stars"

[mira]
display = "Mira Holm"
about = """Two guinea pigs, Pepper and Biscuit, and far too many opinions about hay. \
Library assistant by day."""
links = ["web=https://example.org/mira"]
lang = ["en", "da"]
picture = "guineapig"
facts = ["Pepper is a she, Biscuit is a he: two guinea pigs", "works at the library", "writes about her guinea pigs, books, tea and her small garden"]

[tomas]
