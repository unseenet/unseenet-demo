# Mira's pool. `season` is spring, summer, autumn, winter or any; `pictures` are
# themes (or picture names). A post is used again once the earlier one has expired.

[[post]]
subject = "Leaf piles are guinea pig heaven"
season = "autumn"
pictures = ["guineapigs"]
body = """Raked the garden and brought in a bag of dry leaves (no pesticides, only from \
our own trees). Pepper vanished into the pile at once. Biscuit ate the pile."""
comments = [{by = "ines", body = "Biscuit has the right idea."}]

[[post]]
subject = "The great hay debate"
season = "any"
body = """Biscuit refuses the new bag of hay. Same farm, same field, same everything. \
He sniffs it, looks at me, and walks away. I have been judged by a guinea pig."""
comments = [{by = "nadia", body = "Gordon does the same with new flour. Picky eaters, all of them."},
            {by = "tomas", body = "Maybe it's the second cut. Mine only eat the first."}]

[[post]]
subject = "Vet day"
season = "any"
body = """Annual check-up for both. Teeth fine, weight fine, nails trimmed. Pepper \
squeaked the whole time; Biscuit fell asleep in the vet's hands. Two very different \
animals."""

[[post]]
subject = "Pumpkin, guinea pig approved"
season = "autumn"
pictures = ["guineapig"]
body = """Bits of pumpkin (no seeds, just the flesh) are apparently the best thing that \
ever happened. Small pieces, a few times a week - but try telling them that."""

[[post]]
subject = "Library book sale"
season = "any"
body = """We sold 400 old books at the library today. I bought six. That is not \
how a book sale is supposed to work for the staff."""
comments = [{by = "ole", body = "Any old radio manuals? Asking for a friend. The friend is me."}]

[[post]]
subject = "A new hideout"
season = "any"
body = """Built them a hideout from an old wooden crate. Sanded it, no nails sticking \
out, two doors so nobody gets cornered. They ignored it for a day, and now they \
won't leave it."""

[[post]]
subject = "First frost"
season = "autumn"
body = """Frost on the lawn this morning, so no more garden time for the pigs until \
spring. Pepper stood at the door and complained. I know, Pepper. I know."""

[[post]]
subject = "Reading corner"
season = "any"
pictures = ["home"]
body = """Rainy Sunday. Tea, a blanket, a stack of library books, and two guinea pigs \
wheeking every time the fridge opens. #booklovers"""

[[post]]
subject = "Crunchy leaves"
season = "autumn"
written = "llm"
pictures = ["autumn"]
body = """I love how the sidewalk outside the library turns golden most days, and Pepper and Biscuit perk up whenever I open the window to let the autumn air in. The scent of dry leaves mixing with fresh hay always makes me smile."""

[[post]]
subject = "Tea and books"
season = "autumn"
written = "llm"
pictures = ["home"]
body = """There's something about cradling a warm mug while shelving new arrivals at the library that makes the shorter days feel cozy. After work, I often read a few pages on the porch before the sky turns too dark for the guinea pigs' nighttime zoomies."""

[[post]]
subject = "Guinea pig antics"
season = "autumn"
written = "llm"
pictures = ["guineapigs"]
body = """Pepper insists on nudging a fallen leaf into her tunnel every evening, while Biscuit gives me the hay-look even when the bowl is full. Their little wheeks at the sound of rustling autumn branches always remind me how much they love the season's subtle sounds."""

[[post]]
subject = "Putting the garden to bed"
season = "autumn"
written = "llm"
pictures = ["garden"]
body = """I spent the afternoon cutting back the spent bean vines and tucking straw around the kale that'll keep going through winter. The air smelled of damp soil and woodsmoke from the neighbor's chimney. Pepper and Biscuit supervised from their run, whiskers twitching at every rustle."""

[[post]]
subject = "Spiced pear tea and the holds shelf"
season = "autumn"
written = "llm"
pictures = ["home"]
body = """A patron brought me a jar of her homemade spiced pear preserves, so I've been stirring a spoonful into my afternoon tea all week. The holds shelf is full of ghost stories and cozy mysteries, exactly what the season asks for. I love how the library shifts its rhythm with the light."""

[[post]]
subject = "Kale thieves"
season = "autumn"
written = "llm"
pictures = ["guineapigs"]
body = """Biscuit has developed a shocking talent for pulling whole kale leaves through the bars of his run if I'm not quick enough. Pepper prefers to wait for the hand-delivered pieces, squeaking impatiently at my slowness. I've started growing extra just for them, which feels entirely reasonable."""

[[post]]
subject = "That ending (spoiler!)"
tags = ["books", "spoiler"]
body = """Finished the lighthouse novel from the holds shelf. I did not see it coming: \
the keeper was the narrator's own brother all along, and he never left the island. \
Don't read this if it is still on your list - and then do read it."""
