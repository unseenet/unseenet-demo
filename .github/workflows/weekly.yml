# The demo's weekly run: withdraw what visitors wrote, and post this week's news
# (demo.py weekly). Every Monday early in the morning, and by hand from the Actions tab.
name: Weekly demo

on:
  schedule:
    - cron: "23 4 * * 1"          # Mondays 04:23 UTC
  workflow_dispatch:

concurrency:
  group: weekly-demo              # never two runs at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # postage takes time with young keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tor
        run: sudo apt-get update -q && sudo apt-get install -y -q tor

      - name: The unseenet command line
        run: pip install -q "unseenet>=0.6,<0.7"

      - name: Run the week
        env:
          DEMO_CONFIG: ci.toml
          UNSEENET_DEMO_SEED: ${{ secrets.UNSEENET_DEMO_SEED }}
        run: python demo.py weekly
